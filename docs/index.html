<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agent Guide · 交互式工程指南</title>
  <link rel="stylesheet" href="./shared/tokens.css" />
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      if (params.get("choose") === "1") return;
      const saved = localStorage.getItem("book-lang");
      const navLang = (navigator.language || "zh").toLowerCase();
      const target = saved === "en" || (!saved && !navLang.startsWith("zh")) ? "en" : "zh";
      window.location.replace("./" + target + "/index.html");
    })();
  </script>
  <style>
    .gateway {
      max-width: 720px;
      margin: 96px auto;
      padding: 0 24px;
    }
    .lang-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 28px;
    }
    .lang-card {
      display: block;
      padding: 22px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      text-decoration: none;
      color: var(--text);
      box-shadow: var(--shadow-sm);
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
    }
    .lang-card:hover {
      border-color: var(--teal);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .lang-tag {
      display: inline-block;
      font-size: 11.5px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--teal-soft);
      color: var(--teal);
      margin-bottom: 10px;
    }
    .lang-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .lang-sub { font-size: 13.5px; color: var(--text-secondary); }
    @media (max-width: 640px) {
      .lang-cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="gateway">
    <span class="hero-pill">Interactive Engineering Guide</span>
    <h1 style="margin-top: 12px;">AI Agent Guide</h1>
    <p class="hero-lead">Choose your preferred reading language / 选择阅读语言：</p>
    <div class="lang-cards">
      <a class="lang-card" href="./zh/index.html" onclick="localStorage.setItem('book-lang','zh')">
        <span class="lang-tag">中文版</span>
        <div class="lang-title">AI Agent Guide</div>
        <div class="lang-sub">通过交互实验理解 LLM、Agent 与 RAG 的核心工程机制</div>
      </a>
      <a class="lang-card" href="./en/index.html" onclick="localStorage.setItem('book-lang','en')">
        <span class="lang-tag">English</span>
        <div class="lang-title">AI Agent Guide</div>
        <div class="lang-sub">An interactive engineering guide to LLMs, Agents, and RAG</div>
      </a>
    </div>
  </main>
</body>
</html>
